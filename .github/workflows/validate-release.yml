name: Validate released model runtime
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to validate
        required: true
        default: v0.4.0
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils libvips-tools libvulkan1 mesa-vulkan-drivers
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p released
          gh release download "$RELEASE_TAG" --pattern "recall-for-omarchy-$ARCH.tar.gz*" --dir released
          cd released
          digest=$(awk 'NR==1 {print $1}' "recall-for-omarchy-$ARCH.tar.gz.sha256")
          printf '%s  %s\n' "$digest" "recall-for-omarchy-$ARCH.tar.gz" | sha256sum --check
          tar -xzf "recall-for-omarchy-$ARCH.tar.gz"
      - name: Download and verify pinned model files
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, urllib.request
          files = json.loads(subprocess.check_output(['released/recall-for-omarchy/target/release/recall', 'models']))
          folder = pathlib.Path.home() / '.local/share/recall/Models'
          folder.mkdir(parents=True, exist_ok=True)
          for file in files:
              path = folder / file['name']
              urllib.request.urlretrieve(file['url'], path)
              assert path.stat().st_size == file['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == file['sha256']
          PY
      - name: Verify CPU fallback
        run: RECALL_DEVICE=cpu python3 released/recall-for-omarchy/omarchy/smoke.py
      - name: Verify packaged Vulkan plugin
        run: |
          GGML_VK_VISIBLE_DEVICES=0 RECALL_DEVICE=vulkan released/recall-for-omarchy/target/release/recall-engine devices
          GGML_VK_VISIBLE_DEVICES=0 RECALL_DEVICE=vulkan python3 released/recall-for-omarchy/omarchy/smoke.py
        # Hosted runners exercise Vulkan through Mesa software rendering;
        # Apple M1 Max hardware correctness/performance is checked locally.
