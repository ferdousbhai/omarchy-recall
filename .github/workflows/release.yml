name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      CC: clang
      CXX: clang++
      RECALL_BUILD_VULKAN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng clang cmake ninja-build ffmpeg poppler-utils libvips-tools libvulkan-dev glslc spirv-headers
      - name: Describe the llama.cpp build
        id: llama
        run: |
          set -euo pipefail
          tag=$(sed -n 's/^TAG=\([^[:space:]#]*\).*/\1/p' scripts/build-llama.sh | head -1)
          patch=$(sha256sum scripts/llama.cpp-no-logits.patch | cut -c1-12)
          # The build script's own stamp ignores the compiler and the recipe, so the cache key has to.
          compiler=$(printf '%s %s\n' "$(${CC:-cc} --version | head -1)" "$(${CXX:-c++} --version | head -1)" | tr -cs 'A-Za-z0-9._' '-' | sed 's/^-//; s/-$//')
          backend=cpu
          if command -v nvcc >/dev/null; then backend+="+cuda"; fi
          if pkg-config --exists vulkan && command -v glslc >/dev/null && [[ -f /usr/include/spirv/unified1/spirv.hpp ]]; then
            backend+="+vulkan"
          fi
          if [[ ${RECALL_BUILD_VULKAN:-auto} == 0 ]]; then backend=${backend/+vulkan/}; fi
          {
            echo "tag=$tag"
            echo "patch=$patch"
            echo "compiler=$compiler"
            echo "backend=$backend"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            Vendor/llama
            Vendor/llama.cpp
            Vendor/llama-build
          key: llama-${{ matrix.arch }}-${{ steps.llama.outputs.compiler }}-${{ steps.llama.outputs.backend }}-${{ steps.llama.outputs.tag }}-${{ steps.llama.outputs.patch }}-${{ hashFiles('scripts/build-llama.sh') }}
      - run: scripts/build-llama.sh
      - run: cargo build --release --locked && cargo test --release --locked
      - run: omarchy/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: recall-${{ matrix.arch }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # keyless Sigstore signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign release assets (keyless, GitHub OIDC)
        run: |
          for file in dist/*.tar.gz install.sh; do
            cosign sign-blob --yes --bundle "dist/$(basename "$file").sigstore.json" "$file"
          done
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* install.sh --verify-tag --title "Recall for Omarchy $GITHUB_REF_NAME" --notes-file packaging/release-notes.md
